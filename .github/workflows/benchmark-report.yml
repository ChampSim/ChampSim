name: Benchmark Report

on:
  workflow_dispatch:
    inputs:
      baseline_json:
        description: Optional repository path to a normalized benchmark JSON baseline.
        required: false
        default: ''

permissions:
  contents: read

jobs:
  benchmark_report:
    name: Catch2 benchmark report
    runs-on: ubuntu-latest
    env:
      CXX: g++-13

    steps:
    - name: Set up basic environment
      run: |
        sudo apt-get update
        sudo apt-get install -y curl zip unzip tar g++-13

    - uses: actions/checkout@v6
      with:
        submodules: 'true'
        persist-credentials: false

    - name: Set up vcpkg
      run: |
        vcpkg/bootstrap-vcpkg.sh
        vcpkg/vcpkg install

    - name: Configure
      run: ./config.sh

    - name: Build Catch2 tests
      run: make test/bin/000-test-main

    - name: Inspect Catch2 benchmark support
      run: |
        test/bin/000-test-main --list-reporters
        test/bin/000-test-main --list-tests | tee catch2-tests.txt
        grep -R "BENCHMARK" -n test/cpp src inc || true

    - name: Run Catch2 benchmarks as XML
      run: |
        test/bin/000-test-main \
          --order rand \
          --warn NoAssertions \
          --invisibles \
          --reporter xml::out=catch2-benchmarks.xml

    - name: Inspect generated Catch2 XML
      run: |
        test -s catch2-benchmarks.xml
        python3 - <<'PY'
        from pathlib import Path
        text = Path("catch2-benchmarks.xml").read_text(errors="replace")
        print(text[:4000])
        if "BenchmarkResults" not in text:
            raise SystemExit("No BenchmarkResults found in Catch2 XML")
        PY

    - name: Normalize benchmark output
      run: |
        python3 tools/bench/normalize_catch2_benchmarks.py \
          --input catch2-benchmarks.xml \
          --output benchmark-normalized.json \
          --markdown benchmark-report.md \
          --command 'test/bin/000-test-main --order rand --warn NoAssertions --invisibles --reporter xml::out=catch2-benchmarks.xml' \
          --commit "$GITHUB_SHA"

    - name: Compare with baseline
      if: ${{ inputs.baseline_json != '' }}
      run: |
        python3 tools/bench/compare_benchmark_results.py \
          --baseline "${{ inputs.baseline_json }}" \
          --current benchmark-normalized.json \
          --output-md benchmark-diff.md \
          --output-json benchmark-diff.json

    # First pass: upload artifacts only. PR comments and history publishing can
    # follow later after maintainers choose thresholds and noise policy.
    - name: Upload normalized benchmark JSON
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-normalized-json
        path: benchmark-normalized.json
        if-no-files-found: error

    - name: Upload benchmark Markdown report
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-report-md
        path: benchmark-report.md
        if-no-files-found: error

    - name: Upload benchmark diff JSON
      if: ${{ inputs.baseline_json != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-diff-json
        path: benchmark-diff.json
        if-no-files-found: error

    - name: Upload benchmark diff Markdown report
      if: ${{ inputs.baseline_json != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-diff-md
        path: benchmark-diff.md
        if-no-files-found: error
